site_name: Arbitreria

docs_dir: ../docs

theme:
  name: material
  logo: logo.png
  favicon: favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

# nav:
#   - Home: docs/Meta/README.md  # This will now be served at /
#   - About: docs/Meta/Guia-Mayor.md
    #  - Research: research.html

extra_javascript:
  # - js/katex/dist/katex.min.js
  # - js/katex/dist/contrib/auto-render.min.js
  # - js/math.js  # We'll create this
  - js/mathjax/es5/tex-mml-chtml.js


extra_css:
  - js/katex/dist/katex.min.css

hooks:
  - hooks/copy_assets.py